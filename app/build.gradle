plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---- 开源署名：编译期注入（同时打包 assets/AUTHORSHIP.txt）----
def buildTime = new Date().format("yyyy-MM-dd HH:mm")
def gitShort = "nogit"
try {
    def proc = "git rev-parse --short HEAD".execute(null, rootDir)
    proc.waitFor()
    def out = proc.text.trim()
    if (out) gitShort = out
} catch (Exception ignored) {
}

// ---- Release 签名：本地 keystore.properties（已 gitignore，不提交）----
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.airgesture'
    compileSdk 35

    defaultConfig {
        applicationId "com.airgesture"
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName "1.1.7"

        // 作者记号（BuildConfig.AUTHOR / BUILD_TIME / GIT_COMMIT），构建时写入
        buildConfigField "String", "AUTHOR", "\"7wiligh7\""
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
        buildConfigField "String", "GIT_COMMIT", "\"${gitShort}\""

        // 只打包 arm64：x86/x86_64/armeabi-v7a 仅模拟器与老 32 位机型用，Mi14 永不加载（省 ~13.7MB）
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += "META-INF/LICENSE.md"
            excludes += "META-INF/LICENSE-notice.md"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // CameraX
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    
    // MediaPipe Vision (Hand Detection)
    implementation 'com.google.mediapipe:tasks-vision:0.10.18'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
}
